<script type="module">
// Vertal: the Cloudflare host serves files up to 25 MiB, so the 87 MB wasm ships in parts
// (app/*.part-*, cut with `split -b 22000000`). They are fetched in parallel, joined, checked
// against the original size and SHA-256, and handed to wasm-bindgen as bytes.
import init, * as bindings from './vectorcraft-web-10afe46f41d16361.js';
const WASM = 'app/vectorcraft-web-b34e29aca720ec5e_bg.wasm.part-';
const PARTS = ['aa', 'ab', 'ac', 'ad', 'ae'];
const SIZE = 89734684;
const SHA256 = 'be060db9545f77bdede2fb77046142ddd592cc642bfcac74bdceaf7226f21664';
async function loadWasm() {
  const chunks = await Promise.all(PARTS.map(async (p) => {
    const res = await fetch(WASM + p);
    if (!res.ok) throw new Error(`${WASM}${p}: HTTP ${res.status}`);
    return new Uint8Array(await res.arrayBuffer());
  }));
  const bytes = new Uint8Array(SIZE);
  let offset = 0;
  for (const c of chunks) {
    if (offset + c.length > SIZE) throw new Error('wasm parts are larger than expected');
    bytes.set(c, offset);
    offset += c.length;
  }
  if (offset !== SIZE) throw new Error(`wasm parts total ${offset} bytes, expected ${SIZE}`);
  if (crypto.subtle) {
    const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
    const hex = Array.from(digest, (b) => b.toString(16).padStart(2, '0')).join('');
    if (hex !== SHA256) throw new Error('wasm parts do not match this page (SHA-256 mismatch)');
  }
  return bytes;
}
try {
  const wasm = await init({ module_or_path: await loadWasm() });
  window.wasmBindings = bindings;
  dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));
} catch (err) {
  console.error('VectorCraft failed to start', err);
  const el = document.getElementById('vectorcraft_loading');
  if (el) el.textContent = 'VectorCraft could not start: ' + err.message + '. Reload to try again.';
}
</script>
