<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GridCraft</title>
  <link rel="icon" href="./gridcraft-45f84b7721cb79a9.ico" integrity="sha384-FzBCWcgv5VqBLEPSBvyC78gOs2HMh3hKu2LSLSXU01NgL5yKLk/nHdINuu0Ztky1"/>
  
<script type="module">
// Vertal: the Cloudflare host serves files up to 25 MiB, so the wasm ships in parts
// (app/*.part-*, cut every 20 000 000 bytes). They are fetched in parallel, joined, checked
// against the original size and SHA-256, and handed to wasm-bindgen as bytes.
import init, * as bindings from './gridcraft-web-233d4182a5220cb1.js';
const WASM = 'app/gridcraft-web-d008af624a73cbef_bg.wasm.part-';
const PARTS = ['aa', 'ab'];
const SIZE = 26036124;
const SHA256 = '27c3bedbfeb93f107f5ef2c50847b96189f1badf9dcaca4648acbd7b569c1c51';
async function loadWasm() {
  const chunks = await Promise.all(PARTS.map(async (p) => {
    const res = await fetch(WASM + p);
    if (!res.ok) throw new Error(`${WASM}${p}: HTTP ${res.status}`);
    return new Uint8Array(await res.arrayBuffer());
  }));
  const bytes = new Uint8Array(SIZE);
  let offset = 0;
  for (const c of chunks) {
    if (offset + c.length > SIZE) throw new Error('wasm parts are larger than expected');
    bytes.set(c, offset);
    offset += c.length;
  }
  if (offset !== SIZE) throw new Error(`wasm parts total ${offset} bytes, expected ${SIZE}`);
  if (crypto.subtle) {
    const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
    const hex = Array.from(digest, (b) => b.toString(16).padStart(2, '0')).join('');
    if (hex !== SHA256) throw new Error('wasm parts do not match this page (SHA-256 mismatch)');
  }
  return bytes;
}
try {
  const wasm = await init({ module_or_path: await loadWasm() });
  window.wasmBindings = bindings;
  dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));
} catch (err) {
  console.error('GridCraft failed to start', err);
  const el = document.getElementById('gridcraft_loading');
  if (el) el.textContent = 'GridCraft could not start: ' + err.message + '. Reload to try again.';
}
</script>
