name: 🚀 Deploy to Supabase, Cloudflare & Railway

on:
  push:
    branches:
      - main
      - claude/kubo-vibe-dev-continue-vw754h
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  # ============================================================
  # SUPABASE DEPLOYMENT
  # ============================================================
  deploy-supabase:
    name: 📦 Deploy Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Supabase Link
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push Migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        run: supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Success Notification
        if: success()
        run: echo "✅ Supabase deployment successful!"

      - name: Failure Notification
        if: failure()
        run: echo "❌ Supabase deployment failed!"

  # ============================================================
  # CLOUDFLARE DEPLOYMENT
  # ============================================================
  deploy-cloudflare:
    name: ☁️ Deploy Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare
        run: npm run build:cloudflare
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Success Notification
        if: success()
        run: echo "✅ Cloudflare deployment successful! Available at https://vertal.dev"

      - name: Failure Notification
        if: failure()
        run: echo "❌ Cloudflare deployment failed!"

  # ============================================================
  # RAILWAY DEPLOYMENT
  # ============================================================
  deploy-railway:
    name: 🚂 Deploy Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy to Railway
        uses: railwayapp/deploy-action@v1
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          service: kubovibe-app
          environment: production

      - name: Success Notification
        if: success()
        run: echo "✅ Railway deployment successful!"

      - name: Failure Notification
        if: failure()
        run: echo "❌ Railway deployment failed!"

  # ============================================================
  # VERIFICATION
  # ============================================================
  verify-deployment:
    name: ✅ Verify Deployment
    needs: [deploy-supabase, deploy-cloudflare, deploy-railway]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Supabase Health
        run: |
          curl -s https://sccizjlpwezsgaxkclot.supabase.co/rest/v1/ \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" | head -20
        continue-on-error: true

      - name: Check Cloudflare Health
        run: |
          curl -s https://vertal.dev | head -20
        continue-on-error: true

      - name: Summary
        run: |
          echo "📊 Deployment Summary"
          echo "===================="
          echo "✅ Frontend: https://vertal.dev"
          echo "✅ Supabase: sccizjlpwezsgaxkclot.supabase.co"
          echo "✅ Railway: Configurado"
