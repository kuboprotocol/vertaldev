name: 🚀 Deploy Supabase Edge Functions

# Frontend deploys are handled by the platforms' own GitHub integrations, not by this workflow:
#   - Railway (vertal.dev / kubovibe.dev): builds every push to main with Railpack + Caddy
#     (service build command: npm install --legacy-peer-deps && npm run build:deploy).
#   - Cloudflare Workers Builds ("vertaldev" worker).
# Database migrations are not pushed automatically: production's migration history has drifted from
# supabase/migrations, so `supabase db push` would try to re-run old migrations. Apply them deliberately.

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  SUPABASE_PROJECT_REF: sccizjlpwezsgaxkclot

jobs:
  deploy-functions:
    name: 📦 Deploy Supabase Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Skip when SUPABASE_ACCESS_TOKEN is not configured
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::notice::SUPABASE_ACCESS_TOKEN secret not set; skipping edge function deploy."

      - uses: actions/checkout@v4
        if: env.SUPABASE_ACCESS_TOKEN != ''

      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest

      - name: Deploy edge functions
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

  verify-deployment:
    name: ✅ Verify Deployment
    needs: [deploy-functions]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check site
        run: curl -fsS -o /dev/null -w "vertal.dev → HTTP %{http_code}\n" https://vertal.dev
        continue-on-error: true

      - name: Check Supabase
        run: curl -sS -o /dev/null -w "Supabase → HTTP %{http_code}\n" "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/"
        continue-on-error: true
