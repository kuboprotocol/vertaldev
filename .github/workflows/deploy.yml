name: 🚀 Deploy Supabase Edge Functions

# Frontend deploys are handled by the platforms' own GitHub integrations, not by this workflow:
#   - Railway (vertal.dev / kubovibe.dev): builds every push to main with Railpack + Caddy
#     (service build command: npm install --legacy-peer-deps && npm run build:deploy).
#   - Cloudflare Workers Builds ("vertaldev" worker).
# Database migrations are not pushed automatically: production's migration history has drifted from
# supabase/migrations, so `supabase db push` would try to re-run old migrations. Apply them deliberately.

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  SUPABASE_PROJECT_REF: sccizjlpwezsgaxkclot

jobs:
  deploy-functions:
    name: 📦 Deploy Supabase Edge Functions
    runs-on: ubuntu-latest
    env:
      # SUPABASE_ACCESS_TOKEN1 é o token criado em out/2026; o antigo ficou sem
      # permissão de edge functions. Usa o novo quando existir.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN1 || secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Skip when SUPABASE_ACCESS_TOKEN is not configured
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::notice::SUPABASE_ACCESS_TOKEN secret not set; skipping edge function deploy."

      - uses: actions/checkout@v4
        if: env.SUPABASE_ACCESS_TOKEN != ''

      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest

      # O plano do Supabase limita o número de funções do projeto (criar uma nova
      # dá 402 "Max number of functions reached" e derruba o deploy inteiro).
      # Por isso atualizamos só as que já existem; as novas aparecem como aviso
      # e precisam de espaço no plano (ou de remover funções sem uso).
      - name: Deploy edge functions (existing ones)
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          set -euo pipefail
          existing=$(supabase functions list --project-ref "$SUPABASE_PROJECT_REF" -o json | jq -r '.[].slug')
          to_deploy=()
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [[ "$name" == _* ]] && continue
            [[ -f "$dir/index.ts" ]] || continue
            if grep -qxF "$name" <<< "$existing"; then
              to_deploy+=("$name")
            else
              echo "::warning::Função '$name' não existe no projeto e não foi criada (limite de funções do plano)."
            fi
          done
          echo "Atualizando ${#to_deploy[@]} função(ões) existentes."
          supabase functions deploy "${to_deploy[@]}" --project-ref "$SUPABASE_PROJECT_REF"

  verify-deployment:
    name: ✅ Verify Deployment
    needs: [deploy-functions]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check site
        run: curl -fsS -o /dev/null -w "vertal.dev → HTTP %{http_code}\n" https://vertal.dev
        continue-on-error: true

      - name: Check Supabase
        run: curl -sS -o /dev/null -w "Supabase → HTTP %{http_code}\n" "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/"
        continue-on-error: true
