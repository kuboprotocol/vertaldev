name: Verify deploy configs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-deploy-configs:
    name: vercel.json + render.yaml at repo root
    runs-on: ubuntu-latest
    env:
      JOB_LABEL: verify-deploy-configs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Per-step status accumulator. Each subsequent step appends one row
      # to /tmp/summary-rows.tsv (TSV: step\tstatus\tfile\tdetail) AND one
      # JSON object to /tmp/audit.jsonl. The final steps render the
      # markdown summary AND upload audit artifacts. No actions/cache used.
      - name: Init audit accumulators
        run: |
          : > /tmp/summary-rows.tsv
          : > /tmp/audit.jsonl
          echo "JOB_LABEL=${JOB_LABEL}" >> "$GITHUB_ENV"
          echo "AUDIT_RUN_ID=${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"

      # Shared helper sourced by every step below to (1) emit a GitHub
      # annotation pinned to file/line/title, (2) append a TSV row for the
      # markdown summary, (3) append a JSONL audit record. Centralizing
      # avoids drift between annotation text and audit payload.
      - name: Install audit helper
        run: |
          mkdir -p /tmp/bin
          cat > /tmp/bin/audit.sh <<'BASH'
          #!/usr/bin/env bash
          # audit.sh STEP STATUS FILE LINE TITLE DETAIL
          #   STATUS = ok | fail
          #   FILE   = vercel.json | render.yaml | (none)
          #   LINE   = numeric line in FILE, or 0 if N/A
          set -euo pipefail
          STEP="$1"; STATUS="$2"; FILE="$3"; LINE="${4:-0}"; TITLE="$5"; DETAIL="$6"
          ICON="✅ ok"; [ "$STATUS" = "fail" ] && ICON="❌ fail"
          # 1. PR annotation (only on fail; ok stays quiet to reduce noise).
          if [ "$STATUS" = "fail" ] && [ "$FILE" != "none" ] && [ -n "$FILE" ]; then
            if [ "$LINE" -gt 0 ] 2>/dev/null; then
              echo "::error file=${FILE},line=${LINE},title=${TITLE}::${DETAIL}"
            else
              echo "::error file=${FILE},title=${TITLE}::${DETAIL}"
            fi
          elif [ "$STATUS" = "fail" ]; then
            echo "::error title=${TITLE}::${DETAIL}"
          fi
          # 2. Markdown summary row.
          printf '%s\t%s\t%s\t%s\n' "$STEP" "$ICON" "${FILE}${LINE:+:$LINE}" "$DETAIL" >> /tmp/summary-rows.tsv
          # 3. JSONL audit record (one object per line, jq-friendly).
          # Escape DETAIL/TITLE for JSON via python (always available).
          python3 - "$STEP" "$STATUS" "$FILE" "$LINE" "$TITLE" "$DETAIL" <<'PY' >> /tmp/audit.jsonl
          import json, sys, os, datetime
          step, status, file_, line, title, detail = sys.argv[1:7]
          rec = {
            "ts": datetime.datetime.utcnow().isoformat(timespec="seconds") + "Z",
            "step": step,
            "status": status,
            "file": None if file_ in ("none", "") else file_,
            "line": int(line) if line.isdigit() and int(line) > 0 else None,
            "title": title,
            "detail": detail,
            "run_id": os.environ.get("GITHUB_RUN_ID"),
            "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
            "sha": os.environ.get("GITHUB_SHA"),
            "ref": os.environ.get("GITHUB_REF"),
            "actor": os.environ.get("GITHUB_ACTOR"),
            "workflow": os.environ.get("GITHUB_WORKFLOW"),
            "job": os.environ.get("GITHUB_JOB"),
          }
          print(json.dumps(rec, ensure_ascii=False))
          PY
          BASH
          chmod +x /tmp/bin/audit.sh
          echo "/tmp/bin" >> "$GITHUB_PATH"

      - name: Install PyYAML (required by render.yaml validators)
        run: |
          if python3 -m pip install --quiet --disable-pip-version-check pyyaml \
             && python3 -c "import yaml; print('PyYAML', yaml.__version__)"; then
            audit.sh "Install PyYAML" ok none 0 "PyYAML installed" "PyYAML available for render.yaml parsing"
          else
            audit.sh "Install PyYAML" fail none 0 "PyYAML install failed" "pip install pyyaml returned non-zero"
            exit 1
          fi

      # Removed: vercel.json check. Project migrated to Cloudflare Workers deploy.

      - name: Assert render.yaml exists at repo root
        run: |
          if [ ! -f render.yaml ]; then
            audit.sh "render.yaml exists" fail "render.yaml" 0 \
              "Missing render.yaml" \
              "File missing at repo root — Render Blueprint will not apply redirect/SPA rules."
            exit 1
          fi
          BYTES=$(wc -c < render.yaml)
          echo "✓ render.yaml present (${BYTES} bytes)"
          audit.sh "render.yaml exists" ok "render.yaml" 0 "Present" "${BYTES} bytes"

      # Removed: vercel.json validation. Project migrated to Cloudflare Workers deploy.

      - name: Validate render.yaml is parseable YAML
        run: |
          set +e
          OUT=$(python3 -c "
          import yaml, sys
          try:
              yaml.safe_load(open('render.yaml'))
          except yaml.YAMLError as e:
              mark = getattr(e, 'problem_mark', None)
              if mark is not None:
                  print(f'LINE={mark.line + 1}', file=sys.stderr)
              print(str(e), file=sys.stderr)
              sys.exit(1)
          " 2>&1)
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            LINE=$(echo "$OUT" | grep -oE 'LINE=[0-9]+' | head -1 | cut -d= -f2)
            LINE=${LINE:-0}
            audit.sh "render.yaml valid YAML" fail "render.yaml" "$LINE" \
              "Invalid YAML" "yaml.safe_load threw: ${OUT}"
            exit 1
          fi
          echo "✓ render.yaml is valid YAML"
          audit.sh "render.yaml valid YAML" ok "render.yaml" 0 "Valid YAML" "Parsed cleanly"

      # Removed: vercel.json redirect validation. Project migrated to Cloudflare Workers deploy.

      - name: Assert canonical-domain redirect rule is present in render.yaml
        run: |
          set +e
          OUT=$(python3 - <<'PY' 2>&1
          import yaml, sys
          c = yaml.safe_load(open('render.yaml'))
          ok = False
          for svc in c.get('services', []):
              for rt in svc.get('routes', []):
                  if (rt.get('type') == 'redirect'
                          and rt.get('status') == 301
                          and 'kubovibe.dev' in (rt.get('destination') or '')
                          and 'lovable.app' in ((rt.get('condition') or {}).get('host') or '')):
                      ok = True
          if not ok:
              print('Missing 301 *.lovable.app → kubovibe.dev redirect in render.yaml', file=sys.stderr)
              sys.exit(1)
          print('OK')
          PY
          )
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            # Pin annotation to the "routes:" line of the first service block.
            LINE=$(grep -nE '^[[:space:]]*routes:[[:space:]]*$' render.yaml | head -1 | cut -d: -f1)
            LINE=${LINE:-1}
            audit.sh "render.yaml 301 rule" fail "render.yaml" "$LINE" \
              "Canonical 301 missing" \
              "Missing route: type=redirect, status=301, host=*.lovable.app, destination=*.kubovibe.dev"
            exit 1
          fi
          audit.sh "render.yaml 301 rule" ok "render.yaml" 0 "Canonical 301 present" \
            "*.lovable.app → kubovibe.dev (status 301)"

      # Stage audit files BEFORE the summary, so the upload step can run
      # before the summary and the summary can embed the artifact URL.
      - name: Stage audit artifacts
        if: always()
        run: |
          mkdir -p /tmp/audit-out
          cp /tmp/audit.jsonl       /tmp/audit-out/audit.jsonl       || true
          cp /tmp/summary-rows.tsv  /tmp/audit-out/summary-rows.tsv  || true
          # Build a self-contained markdown report (mirror of step summary).
          {
            echo "# Verify deploy configs — audit"
            echo ""
            echo "- Workflow: \`${GITHUB_WORKFLOW}\`"
            echo "- Job: \`${GITHUB_JOB}\` (\`${JOB_LABEL}\`)"
            echo "- Run: \`${GITHUB_RUN_ID}\` attempt \`${GITHUB_RUN_ATTEMPT}\`"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- Actor: \`${GITHUB_ACTOR}\`"
            echo "- Status: \`${{ job.status }}\`"
            echo ""
            echo "| # | Check | Status | File:Line | Detail |"
            echo "|---|---|---|---|---|"
            i=0
            if [ -s /tmp/summary-rows.tsv ]; then
              while IFS=$'\t' read -r step status fileline detail; do
                i=$((i+1))
                echo "| ${i} | ${step} | ${status} | \`${fileline:-—}\` | ${detail} |"
              done < /tmp/summary-rows.tsv
            fi
          } > /tmp/audit-out/audit.md
          ls -la /tmp/audit-out/

      # Upload BEFORE summary so we can capture artifact-url and embed it.
      # upload-artifact@v4 exposes outputs.artifact-url (deep-link to the
      # artifact's download page on the run UI) and outputs.artifact-id.
      - name: Upload audit artifact
        id: upload-audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-deploy-configs-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/audit-out/
          retention-days: 30
          if-no-files-found: warn

      # Always render the summary (even on previous-step failure). Includes
      # a direct hyperlink to the artifact uploaded above + a fallback link
      # to the run's "Artifacts" tab when artifact-url is unavailable
      # (e.g. upload itself failed).
      - name: Render job summary
        if: always()
        env:
          ARTIFACT_NAME: verify-deploy-configs-audit-${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_URL: ${{ steps.upload-audit.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload-audit.outputs.artifact-id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## 🚦 Verify deploy configs — \`${JOB_LABEL}\`"
            echo ""
            echo "Static validation of \`vercel.json\` and \`render.yaml\` at repo root."
            echo "_No \`actions/cache\` used — each run is fully reproducible._"
            echo "_Failed checks are also pinned as inline PR annotations on the offending file/line._"
            echo ""
            echo "| # | Check | Status | File:Line | Detail |"
            echo "|---|---|---|---|---|"
            i=0
            if [ -s /tmp/summary-rows.tsv ]; then
              while IFS=$'\t' read -r step status fileline detail; do
                i=$((i+1))
                echo "| ${i} | ${step} | ${status} | \`${fileline:-—}\` | ${detail} |"
              done < /tmp/summary-rows.tsv
            else
              echo "| — | (no checks recorded) | ⚪ n/a | — | accumulator empty |"
            fi
            echo ""
            echo "**Overall:** \`${{ job.status }}\` · runner \`${{ runner.os }}\` · commit \`${{ github.sha }}\` · attempt \`${{ github.run_attempt }}\`"
            echo ""
            echo "### 📎 Audit artifact"
            if [ -n "${ARTIFACT_URL}" ]; then
              echo ""
              echo "- **Direct link:** [${ARTIFACT_NAME}](${ARTIFACT_URL})"
              [ -n "${ARTIFACT_ID}" ] && echo "- **Artifact ID:** \`${ARTIFACT_ID}\`"
              echo "- **Contents:** \`audit.jsonl\` (one JSON record per check) · \`summary-rows.tsv\` · \`audit.md\`"
              echo "- **Retention:** 30 days"
            else
              echo ""
              echo "- ⚠️ \`artifact-url\` not exposed by upload step (upload may have failed or skipped)."
              echo "- Fallback: open the **Artifacts** section on the [run page](${RUN_URL}) and look for \`${ARTIFACT_NAME}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"




  live-redirect-curl-check:
    name: Live 301 redirect (curl)
    runs-on: ubuntu-latest
    needs: verify-deploy-configs
    # Only run on push to main (post-deploy verification). PRs validate config
    # statically above; live curl needs the deployed edge to be up to date.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Curl sample *.lovable.app URLs (301 + Location + validators + empty body)
        run: |
          set -euo pipefail

          # We lock four server-side guarantees per sample:
          #   1. HTTP status is exactly 301
          #   2. Location preserves host swap + path + query-string verbatim
          #   3. Validator headers (ETag, Last-Modified, Cache-Control) are present
          #   4. Response body is empty (no SPA shell leaking onto the 301)
          # Hash fragments are stripped by curl before send (RFC 3986 §3.5);
          # the Playwright spec covers browser-side hash preservation by
          # asserting window.location.hash on the destination.
          SAMPLES=(
            "https://kubovibe.lovable.app/|https://kubovibe.dev/"
            "https://kubovibe.lovable.app/connectors/github|https://kubovibe.dev/connectors/github"
            "https://kubovibe.lovable.app/dashboard?ref=email&t=1|https://kubovibe.dev/dashboard?ref=email&t=1"
            "https://kubovibe.lovable.app/app/proj-123/meu-app?ref=email&t=1|https://kubovibe.dev/app/proj-123/meu-app?ref=email&t=1"
            # Hash present on source — curl drops it (RFC 3986 §3.5) before
            # send, server must 301 to the bare path+query, and the Location
            # MUST NEVER carry a '#' fragment (asserted below for every row).
            # Browser-side hash reattachment is covered by the Playwright spec.
            "https://kubovibe.lovable.app/pricing#enterprise|https://kubovibe.dev/pricing"
            "https://kubovibe.lovable.app/dashboard?ref=email#section-2|https://kubovibe.dev/dashboard?ref=email"
            # Empty hash (bare '#') — stripped by curl, must still 301 cleanly.
            "https://kubovibe.lovable.app/pricing#|https://kubovibe.dev/pricing"
            # Percent-encoded fragment chars — same rule: '#' never reaches edge.
            "https://kubovibe.lovable.app/docs#sec%3D2|https://kubovibe.dev/docs"
            "https://kubovibe.lovable.app/docs#a%20b|https://kubovibe.dev/docs"
            "https://kubovibe.lovable.app/buscar?q=caf%C3%A9#caf%C3%A9|https://kubovibe.dev/buscar?q=caf%C3%A9"
            # Encoded query matrix: spaces, ampersands, plus, slashes, unicode
            "https://kubovibe.lovable.app/search?q=hello%20world|https://kubovibe.dev/search?q=hello%20world"
            "https://kubovibe.lovable.app/search?q=a%26b%3Dc|https://kubovibe.dev/search?q=a%26b%3Dc"
            "https://kubovibe.lovable.app/search?q=a+b&x=1|https://kubovibe.dev/search?q=a+b&x=1"
            "https://kubovibe.lovable.app/app/My%20Project?token=abc%2Fdef|https://kubovibe.dev/app/My%20Project?token=abc%2Fdef"
            "https://kubovibe.lovable.app/buscar?q=caf%C3%A9|https://kubovibe.dev/buscar?q=caf%C3%A9"
            "https://kubovibe.lovable.app/app/proj/run?ids%5B%5D=1&ids%5B%5D=2|https://kubovibe.dev/app/proj/run?ids%5B%5D=1&ids%5B%5D=2"
          )

          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          fail=0
          for pair in "${SAMPLES[@]}"; do
            src="${pair%%|*}"
            want="${pair##*|}"
            echo "→ $src"

            # -D dumps headers; -o writes body to file so we can size it.
            headers=$(curl -sS -o "$tmp" -D - --max-time 15 "$src" || true)
            status=$(echo "$headers"   | awk 'NR==1{print $2}')
            location=$(echo "$headers" | awk 'BEGIN{IGNORECASE=1} /^location:/      {sub(/\r$/,""); sub(/^[Ll]ocation:[[:space:]]*/,""); print; exit}')
            etag=$(echo "$headers"     | awk 'BEGIN{IGNORECASE=1} /^etag:/          {sub(/\r$/,""); sub(/^[Ee][Tt]ag:[[:space:]]*/,""); print; exit}')
            lastmod=$(echo "$headers"  | awk 'BEGIN{IGNORECASE=1} /^last-modified:/ {sub(/\r$/,""); sub(/^[Ll]ast-[Mm]odified:[[:space:]]*/,""); print; exit}')
            cc=$(echo "$headers"       | awk 'BEGIN{IGNORECASE=1} /^cache-control:/ {sub(/\r$/,""); sub(/^[Cc]ache-[Cc]ontrol:[[:space:]]*/,""); print; exit}')
            body_size=$(wc -c < "$tmp" | tr -d ' ')

            if [ "$status" != "301" ]; then
              echo "::error::Expected 301 from $src, got $status"; fail=1; continue
            fi
            if [ "$location" != "$want" ]; then
              echo "::error::Bad Location for $src — want '$want', got '$location'"; fail=1; continue
            fi
            # RFC 7231 §7.1.2: Location MUST NOT carry a fragment — UA reuses
            # the original request URI's fragment after following the 301.
            case "$location" in
              *"#"*)
                echo "::error::Location for $src must not contain '#' fragment — got '$location'"; fail=1; continue
                ;;
            esac
            if [ -z "$cc" ]; then
              echo "::error::Missing Cache-Control on 301 for $src"; fail=1; continue
            fi
            if [ -z "$etag" ] && [ -z "$lastmod" ]; then
              echo "::error::Missing both ETag and Last-Modified validators on 301 for $src"; fail=1; continue
            fi
            if [ "$body_size" -gt 0 ]; then
              echo "::error::301 body must be empty for $src — got ${body_size} bytes"; fail=1; continue
            fi
            echo "  ✓ 301 → $location  [CC='$cc' ETag='$etag' LM='$lastmod' body=0]"
          done

          exit $fail
