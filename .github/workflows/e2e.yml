name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright (chromium, main suite)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      JOB_LABEL: playwright-chromium
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        id: setup-node
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Report npm cache (key + miss streak)
        uses: ./.github/actions/npm-cache-report
        with:
          job-label: ${{ env.JOB_LABEL }}
          cache-hit: ${{ steps.setup-node.outputs.cache-hit }}
          lockfile-hash: ${{ hashFiles('package-lock.json') }}
          node-version: "20"
          strict: ${{ vars.NPM_CACHE_STRICT || 'warn' }}
          max-misses: ${{ vars.NPM_CACHE_MAX_MISSES || '3' }}

      # Vite cache helps when e2e boots the dev/preview server.
      - name: Cache Vite
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            .vite
          key: ${{ runner.os }}-vite-${{ hashFiles('package-lock.json', 'vite.config.ts', 'tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      # Cache Playwright browser binaries keyed on the installed @playwright/test version.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: |
          echo "::group::[${JOB_LABEL}] npm ci"
          npm ci --prefer-offline --no-audit --fund=false
          echo "::endgroup::"

      - name: Install Playwright Chromium (with system libs)
        run: |
          echo "::group::[${JOB_LABEL}] playwright install chromium"
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "[${JOB_LABEL}] playwright browsers cache: HIT — installing system deps only"
            npx playwright install-deps chromium
          else
            echo "[${JOB_LABEL}] playwright browsers cache: MISS — full install"
            npx playwright install --with-deps chromium
          fi
          echo "::endgroup::"

      - name: Run Playwright tests (excluding split redirect-cache suites)
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          # VITE_SUPABASE_* are public (publishable key) and come from the
          # committed .env. They used to be mapped from secrets here; with the
          # secrets unset they arrived as empty strings, which take precedence
          # over .env in Vite, and the app never connected to Supabase.
        run: |
          echo "::group::[${JOB_LABEL}] playwright test (main suite)"
          npx playwright test --project=chromium --grep-invert "(hash preservation across cached 301|fuzz #)" || (echo "E2E failed: see the Playwright output above and the playwright-report-chromium artifact" && exit 1)
          echo "::endgroup::"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: playwright-report/
          retention-days: 14

  redirect-hash-suite:
    name: Redirect hash matrix (chromium)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      JOB_LABEL: hash-suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: setup-node
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Report npm cache (key + miss streak)
        uses: ./.github/actions/npm-cache-report
        with:
          job-label: ${{ env.JOB_LABEL }}
          cache-hit: ${{ steps.setup-node.outputs.cache-hit }}
          lockfile-hash: ${{ hashFiles('package-lock.json') }}
          node-version: "20"
          strict: ${{ vars.NPM_CACHE_STRICT || 'warn' }}
          max-misses: ${{ vars.NPM_CACHE_MAX_MISSES || '3' }}

      - name: Cache Vite
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            .vite
          key: ${{ runner.os }}-vite-${{ hashFiles('package-lock.json', 'vite.config.ts', 'tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: |
          echo "::group::[${JOB_LABEL}] npm ci"
          npm ci --prefer-offline --no-audit --fund=false
          echo "::endgroup::"

      - name: Install Playwright Chromium (with system libs)
        run: |
          echo "::group::[${JOB_LABEL}] playwright install chromium"
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "[${JOB_LABEL}] playwright browsers cache: HIT — installing system deps only"
            npx playwright install-deps chromium
          else
            echo "[${JOB_LABEL}] playwright browsers cache: MISS — full install"
            npx playwright install --with-deps chromium
          fi
          echo "::endgroup::"

      - name: Run hash-preservation matrix only
        run: |
          echo "::group::[${JOB_LABEL}] playwright hash-preservation matrix"
          npx playwright test --project=chromium e2e/canonical-domain-redirect-cache.spec.ts --grep "hash preservation across cached 301"
          echo "::endgroup::"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-hash
          path: playwright-report/
          retention-days: 14

  redirect-fuzz-suite:
    name: Redirect fuzz suite (chromium)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      JOB_LABEL: fuzz-suite
      FUZZ_SEED_BASE: ${{ vars.FUZZ_SEED_BASE || '12648430' }}
      FUZZ_COUNT: ${{ vars.FUZZ_COUNT || '12' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: setup-node
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Report npm cache (key + miss streak)
        uses: ./.github/actions/npm-cache-report
        with:
          job-label: ${{ env.JOB_LABEL }}
          cache-hit: ${{ steps.setup-node.outputs.cache-hit }}
          lockfile-hash: ${{ hashFiles('package-lock.json') }}
          node-version: "20"
          strict: ${{ vars.NPM_CACHE_STRICT || 'warn' }}
          max-misses: ${{ vars.NPM_CACHE_MAX_MISSES || '3' }}

      - name: Cache Vite
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            .vite
          key: ${{ runner.os }}-vite-${{ hashFiles('package-lock.json', 'vite.config.ts', 'tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: |
          echo "::group::[${JOB_LABEL}] npm ci"
          npm ci --prefer-offline --no-audit --fund=false
          echo "::endgroup::"

      - name: Install Playwright Chromium (with system libs)
        run: |
          echo "::group::[${JOB_LABEL}] playwright install chromium"
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "[${JOB_LABEL}] playwright browsers cache: HIT — installing system deps only"
            npx playwright install-deps chromium
          else
            echo "[${JOB_LABEL}] playwright browsers cache: MISS — full install"
            npx playwright install --with-deps chromium
          fi
          echo "::endgroup::"

      - name: Run fuzz suite (deterministic seeds)
        run: |
          echo "::group::[${JOB_LABEL}] playwright fuzz suite (seed_base=${FUZZ_SEED_BASE} count=${FUZZ_COUNT})"
          npx playwright test --project=chromium e2e/canonical-domain-redirect-cache.spec.ts --grep "fuzz #"
          echo "::endgroup::"

      - name: Upload Playwright report (with persisted fuzz seeds)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-fuzz
          path: playwright-report/
          retention-days: 30

      - name: Upload fuzz seed manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-seeds
          path: playwright-report/fuzz-seeds.json
          retention-days: 90
          if-no-files-found: warn

  redirect-cache-cross-browser:
    name: Redirect cache (${{ matrix.project }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      JOB_LABEL: redirect-cache-${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: firefox-redirect-cache
            browser: firefox
          - project: webkit-redirect-cache
            browser: webkit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        id: setup-node
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Report npm cache (key + miss streak)
        uses: ./.github/actions/npm-cache-report
        with:
          job-label: ${{ env.JOB_LABEL }}
          cache-hit: ${{ steps.setup-node.outputs.cache-hit }}
          lockfile-hash: ${{ hashFiles('package-lock.json') }}
          node-version: "20"
          strict: ${{ vars.NPM_CACHE_STRICT || 'warn' }}
          max-misses: ${{ vars.NPM_CACHE_MAX_MISSES || '3' }}

      - name: Cache Vite
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            .vite
          key: ${{ runner.os }}-vite-${{ hashFiles('package-lock.json', 'vite.config.ts', 'tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      # Per-browser Playwright cache so firefox/webkit don't invalidate each other.
      - name: Cache Playwright browsers (${{ matrix.browser }})
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ matrix.browser }}-

      - name: Install dependencies
        run: |
          echo "::group::[${JOB_LABEL}] npm ci"
          npm ci --prefer-offline --no-audit --fund=false
          echo "::endgroup::"

      - name: Install Playwright browser (${{ matrix.browser }})
        run: |
          echo "::group::[${JOB_LABEL}] playwright install ${{ matrix.browser }}"
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "[${JOB_LABEL}] playwright browsers cache: HIT — installing system deps only"
            npx playwright install-deps ${{ matrix.browser }}
          else
            echo "[${JOB_LABEL}] playwright browsers cache: MISS — full install"
            npx playwright install --with-deps ${{ matrix.browser }}
          fi
          echo "::endgroup::"

      - name: Run canonical-domain redirect cache spec (excluding fuzz)
        run: |
          echo "::group::[${JOB_LABEL}] playwright redirect-cache spec"
          npx playwright test --project=${{ matrix.project }} e2e/canonical-domain-redirect-cache.spec.ts --grep-invert "fuzz #"
          echo "::endgroup::"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14
